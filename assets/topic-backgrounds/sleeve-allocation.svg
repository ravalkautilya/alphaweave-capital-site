<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Allocate across sleeves</title><desc>A portfolio budget branches into three sleeve allocations. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><rect x="230" y="50" width="140" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="300.0" y="87" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Capital</text><path d="M300 110L100 185" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="35" y="190" width="130" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="100.0" y="227" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Sleeve A</text><path d="M300 110L290 185" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="225" y="190" width="130" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="290.0" y="227" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Sleeve B</text><path d="M300 110L480 185" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="415" y="190" width="130" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="480.0" y="227" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Sleeve C</text></svg>