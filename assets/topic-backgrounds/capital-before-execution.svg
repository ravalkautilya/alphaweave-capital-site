<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Not just execution</title><desc>Reviewed signal becomes capital intent before execution. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><rect x="45.0" y="170" width="98.5" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="94.25" y="207" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Signal</text><path d="M147.5 200L162.5 200" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="167.5" y="170" width="98.5" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="216.75" y="207" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Review</text><path d="M270.0 200L285.0 200" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="290.0" y="170" width="98.5" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="339.25" y="207" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Capital</text><path d="M392.5 200L407.5 200" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="412.5" y="170" width="98.5" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="461.75" y="207" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Execution</text><text x="290" y="100" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Allocation precedes the order</text></svg>