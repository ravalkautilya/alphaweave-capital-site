<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Regime replay</title><desc>Distinct trend, shock, and range segments appear along a replay path. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><polyline points="50,60 50,285 550,285" fill="none" stroke="#526f83" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="50,220 110,170 180,120" fill="none" stroke="#075644" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="180,120 230,260 290,210" fill="none" stroke="#526f83" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="290,210 350,180 410,220 470,180 550,210" fill="none" stroke="#075644" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="150" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Trend / shock</text><text x="340" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526f83">Range</text><polyline points="190,60 190,280" fill="none" stroke="#526f83" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 8"/><polyline points="290,60 290,280" fill="none" stroke="#526f83" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 8"/></svg>