<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Reduce noise</title><desc>A noisy raw signal is compared with a smoother filtered path. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><polyline points="50,60 50,285 550,285" fill="none" stroke="#526f83" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="50,180 80,95 110,250 150,125 190,225 230,85 275,240 320,125 365,245 415,120 465,215 505,95 550,180" fill="none" stroke="#526f83" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="50,185 120,180 190,175 270,170 350,165 430,160 550,155" fill="none" stroke="#075644" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="150" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Raw signal</text><text x="340" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526f83">Filtered signal</text></svg>