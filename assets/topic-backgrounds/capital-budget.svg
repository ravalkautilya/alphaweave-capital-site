<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Set the capital budget</title><desc>Capital is split between deployed allocation and retained cash. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><circle cx="210" cy="175" r="92" fill="none" stroke="#526f83" stroke-width="45"/><circle cx="210" cy="175" r="92" fill="none" stroke="#075644" stroke-width="45" stroke-dasharray="435 578" transform="rotate(-90 210 175)"/><text x="440" y="140" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Deployed</text><text x="440" y="210" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526f83">Cash reserve</text><polyline points="320,140 375,140" fill="none" stroke="#075644" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><polyline points="280,245 375,215" fill="none" stroke="#526f83" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/></svg>