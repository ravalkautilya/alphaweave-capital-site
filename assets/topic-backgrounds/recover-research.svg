<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Recover</title><desc>A paused run resumes from a preserved checkpoint. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><path d="M50 150L540 150" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="85.0" cy="150" r="23" fill="none" stroke="#075644" stroke-width="4"/><text x="85.0" y="218" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Run</text><circle cx="295.0" cy="150" r="23" fill="none" stroke="#075644" stroke-width="4"/><text x="295.0" y="218" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Checkpoint</text><circle cx="505.0" cy="150" r="23" fill="none" stroke="#075644" stroke-width="4"/><text x="505.0" y="218" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Resume</text><rect x="275" y="230" width="55" height="55" rx="10" fill="#526f83" stroke="#075644" stroke-width="4"/><path d="M300 235L300 188" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="300" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Saved state</text></svg>