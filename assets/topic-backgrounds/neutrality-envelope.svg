<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Neutrality</title><desc>Long and short exposures balance around a central neutrality target. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><polyline points="80,180 520,180" fill="none" stroke="#526f83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="95" y="75" width="80" height="105" rx="10" fill="#075644" stroke="#075644" stroke-width="4"/><rect x="205" y="120" width="80" height="60" rx="10" fill="#075644" stroke="#075644" stroke-width="4"/><rect x="315" y="180" width="80" height="95" rx="10" fill="#526f83" stroke="#075644" stroke-width="4"/><rect x="425" y="180" width="80" height="70" rx="10" fill="#526f83" stroke="#075644" stroke-width="4"/><text x="180" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Long exposure</text><text x="420" y="325" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Short exposure</text><text x="300" y="55" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Net / gross / beta</text></svg>