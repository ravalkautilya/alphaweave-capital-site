<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"><title>Capital balance</title><desc>Relative long and short sizes remain within a sleeve budget. Conceptual illustration, not measured results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075644"/></marker></defs><rect x="225" y="40" width="150" height="60" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="300.0" y="77" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Sleeve budget</text><path d="M270 100L165 170" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M330 100L440 170" stroke="#075644" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="65" y="190" width="200" height="80" rx="10" fill="none" stroke="#075644" stroke-width="4"/><rect x="355" y="190" width="180" height="80" rx="10" fill="none" stroke="#075644" stroke-width="4"/><text x="165" y="237" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Long size</text><text x="445" y="237" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#075644">Short size</text><polyline points="300,150 300,300" fill="none" stroke="#986818" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/></svg>